playback:
  default_volume: 1.0
  fade_ms: 150
  playlist_mode: shuffle
  ui_fps: 24
  ui_width: 160
  marquee:
    enabled: true
    hold_secs: 5.0
    step_interval: 0.3
    gap_cols: 4
dsp:
  chain:
  - eq
  - vbe
  - exciter
  - widener
  - loudness
  - limiter
  loudness:
    enabled: true
    target_lufs: -16.0
  vbe:
    enabled: true
    gain_db: -3.0
  limiter:
    enabled: true
    threshold_db: -0.5
    release_ms: 150.0
  exciter:
    enabled: true
    freq_hz: 3500.0
    mix: 0.15
  widener:
    enabled: true
    width: 1.3
    hp_freq_hz: 250.0
    room_mix: 0.0
